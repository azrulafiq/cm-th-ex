# from task 2 - mount the db password from secret manager (gke secret manager add-on)
# pod auths as app-ksa -> cm-app gsa via workload identity, cm-app has secretAccessor on this secret only
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-db-secret
  namespace: app
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/cloud-mile-assessment/secrets/cm-db-password/versions/latest"
        path: "db-password"
