# from task 2 - scale on the app container cpu only (not the proxy sidecar)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    # default is 5 min, shorter so the scale down shows up in the demo
    scaleDown:
      stabilizationWindowSeconds: 120
