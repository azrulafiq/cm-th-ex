# from task 2 - lb backend settings: health check path, draining, lb request logs
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: app-backendconfig
  namespace: app
spec:
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
  connectionDraining:
    drainingTimeoutSec: 30
  logging:
    enable: true
    sampleRate: 1.0
